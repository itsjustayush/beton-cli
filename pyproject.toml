[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beton-cli"
version = "0.3.4"
description = "BETON — solid tools for your computer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayush Bhattacharya", email = "info.cometlabs@gmail.com" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
]

[project.urls]
Homepage = "https://beton-cli.vercel.app/"
Repository = "https://github.com/itsjustayush/beton-cli"
Documentation = "https://beton-cli.vercel.app/documentation"
Releases = "https://github.com/itsjustayush/beton-cli/releases"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
beton = "beton.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
